id = "nathan-poncet.herdr-fingers"
name = "Herdr Fingers"
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "tmux-fingers for Herdr: type a short hint over a path or URL in the pane to preview it (image, text, directory, browser) or copy it."
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "start"
title = "Fingers: show hints"
description = "Label every path and URL in the focused pane; type a label to preview or copy it (Shift pastes, Ctrl opens)."
contexts = ["pane", "workspace", "global"]
command = ["./target/release/herdr-fingers", "start"]

# The overlay itself. Opened by the `start` action, never bind it directly:
# the action records where the focused pane sits first, so the hints land on it.
[[panes]]
id = "overlay"
title = "Fingers"
placement = "overlay"
command = ["./target/release/herdr-fingers", "ui"]

# The image popup. Opened by the overlay's "Preview" with the image path in
# its environment, never bind it directly.
[[panes]]
id = "viewer"
title = "Image"
placement = "popup"
command = ["./target/release/herdr-fingers", "view"]

# The text popup: pages a text file or lists a directory. Opened by the
# overlay's "Preview", never bind it directly.
[[panes]]
id = "pager"
title = "Preview"
placement = "popup"
command = ["./target/release/herdr-fingers", "page"]
